name: Test code

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: pre-commit/action@v3.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test_code:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        plugin: [emode, femwell, meow, sax, tidy3d, klayout, vlsir, path_length_analysis, elmer, ansys, comsol]
        os: [ubuntu-latest]
        python-version: [3.12]
        exclude:
          - plugin: femwell
            os: macos-latest
          - plugin: femwell
            os: windows-latest
          - plugin: sax
            python-version: 3.13

    name: Test ${{ matrix.plugin }} ${{ matrix.os }} ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get install -y libglu1-mesa
      - name: Install dependencies
        run: |
          uv venv -p ${{ matrix.python-version }}
          uv pip install .[${{ matrix.plugin }},dev] setuptools
          make test-data
      - name: Test with pytest
        run: |
          uv run pytest gplugins/${{ matrix.plugin }}
      - name: Test capacitance wrapper
        if: ${{ matrix.plugin == 'elmer' }}
        run: uv run pytest gplugins/common/utils/tests/test_get_capacitance.py

  test_meep:
    runs-on: ubuntu-latest
    name: Test meep ubuntu-latest 3.11
    steps:
      - uses: actions/checkout@v7
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: 3.11
      - name: Install libglu1-mesa
        run: |
          sudo apt-get install -y libglu1-mesa
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda create -n mp python=3.11 -y
          conda activate mp
          conda install -c conda-forge pymeep pymeep-extras gdsfactory -y
          pip install .[meep,dev] setuptools
          pip install "numpy<2.0"
          make test-data
      - name: Test with pytest
        shell: bash -l {0}
        run: |
          conda activate mp
          pytest gplugins/gmeep

  test_palace:
    runs-on: ubuntu-latest
    name: Test palace ubuntu-latest 3.11
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Setup Apptainer
        uses: eWaterCycle/setup-apptainer@3f706d898c9db585b1d741b4692e66755f3a1b40
        with:
          apptainer-version: 1.4.2
      - name: Install libglu1-mesa
        run: |
          sudo apt-get install -y libglu1-mesa
      - name: Download Palace singularity definition
        run: wget https://raw.githubusercontent.com/awslabs/palace/refs/tags/v0.16.0/singularity/singularity.def # Newer versions of palace have deprecated singularity definitions, so we pin to a specific version. TODO: Update this
      - name: Pin Palace source and fail hard on build errors
        run: |
          # The upstream definition clones the default branch, which needs C++20 and no longer
          # builds with the container's GCC 11. Pin it to the release the definition comes from.
          sed -i 's|git clone https://github.com/awslabs/palace.git /opt/palace-src|git clone --branch v0.16.0 --depth 1 https://github.com/awslabs/palace.git /opt/palace-src|' singularity.def
          # Without -e a failed compile is masked by the later commands in %post, and the
          # partially built image is cached and silently reused by every following run.
          sed -i '/^%post -c \/bin\/bash$/a\    set -e' singularity.def
          grep -q '^    set -e$' singularity.def
          grep -q -- '--branch v0.16.0' singularity.def
      - name: Cache Palace container restore
        id: cache-palace-restore
        uses: actions/cache/restore@v6
        with:
          path: palace.sif
          key: palace-container-${{ runner.os }}-v0.16.0-${{ hashFiles('singularity.def') }}
      - name: Build palace from source
        if: steps.cache-palace-restore.outputs.cache-hit != 'true'
        run: |
          echo "Building Palace container from source (this may take a while)…"
          echo "Note: This is a one-time build that will be cached for future runs"
          # sudo resets PATH, so apptainer from the action tool cache is not on it
          timeout 3600 sudo env "PATH=$PATH" "$(command -v apptainer)" build palace.sif singularity.def || {
            echo "Build timed out or failed after 60 minutes. Palace tests will be skipped."
            exit 1
          }
      - name: Cache Palace container save
        uses: actions/cache/save@v6
        if: steps.cache-palace-restore.outputs.cache-hit != 'true'
        with:
          path: palace.sif
          key: palace-container-${{ runner.os }}-v0.16.0-${{ hashFiles('singularity.def') }}
      - name: Create palace alias
        run: |
          # Create a shell script that acts as an alias for palace
          echo '#!/bin/bash' > palace
          echo "sudo apptainer run $GITHUB_WORKSPACE/palace.sif \"\$@\" " >> palace
          chmod +x palace
          echo "$GITHUB_WORKSPACE" >> $GITHUB_PATH
          echo "Palace executable created successfully"
      - name: Verify Palace installation
        run: palace --version
      - name: Test with pytest
        run: sudo env "PATH=$PATH" "$(which uv)" run --extra dev --extra meshwell pytest gplugins/palace -v

  test_code_coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install libglu1-mesa
        run: |
          sudo apt-get install -y libglu1-mesa
      - name: Install dependencies
        run: |
          make install test-data
      - name: Test with pytest
        run: |
          make cov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
